<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Machine Madlibs – field:work | Activity 01 – Micro-fictions</title>
    <link rel="stylesheet" href="css/normalize.css" />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/activity-01.css" />
  </head>
  <body class="page--fit">
    <header class="site-header">
      <h1>Machine Madlibs <span class="site-header__event">field:work</span></h1>
      <nav class="site-nav">
        <a href="activity_01.html" class="active">Activity 01</a>
        <a href="activity_02.html">Activity 02</a>
        <a href="activity_03.html">Activity 03</a>
      </nav>
      <div class="site-header__actions">
        <button type="button" class="help-btn" aria-label="How this works">?</button>
        <button type="button" class="restart-btn">New story</button>
        <button class="save-btn">↓ Download Text</button>
      </div>
    </header>

    <div class="info">
      <details class="info__panel" data-peek="writer">
        <summary>Peek at the system prompt</summary>
        <div class="info__body"></div>
      </details>
    </div>

    <p class="notice" role="status" hidden></p>

    <main>
      <section class="activity-01">
        <div class="text-display">
          <div class="story" aria-live="polite"></div>
        </div>

        <aside class="wildcard" hidden>
          <div class="wildcard__content">
            <p class="wildcard__label">Wild card</p>
            <ul class="wildcard__words"></ul>
            <p class="wildcard__note">
              Use one of these in your next sentence. The machine will work in a different
              one.
            </p>
          </div>
          <button type="button" class="wildcard__dismiss" aria-label="Put the card back">
            ×
          </button>
        </aside>

        <form class="prompt">
          <button type="button" class="prompt__card">Wild card</button>
          <input type="text" maxlength="400" aria-label="Your next sentence" />
          <button type="submit" class="prompt__send" aria-label="Send">↑</button>
        </form>
        <p class="word-count"></p>
      </section>
    </main>

    <script src="js/common.js"></script>
    <script src="js/instructions.js"></script>
    <script src="js/activity-01.js"></script>
  </body>
</html>
