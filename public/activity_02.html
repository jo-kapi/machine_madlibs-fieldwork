<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Machine Madlibs – field:work | Activity 02 – Visual Poetry</title>
    <link rel="stylesheet" href="css/normalize.css" />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/buttons.css" />
    <link rel="stylesheet" href="css/dialogs.css" />
    <link rel="stylesheet" href="css/peek.css" />
    <link rel="stylesheet" href="css/activity-02.css" />
  </head>
  <body class="page--fit-wide">
    <header class="site-header">
      <h1>Machine Madlibs <span class="site-header__event">field:work</span></h1>
      <nav class="site-nav">
        <a href="activity_01.html" class="site-nav__link">Activity 01</a>
        <a href="activity_02.html" class="site-nav__link" aria-current="page"
          >Activity 02</a
        >
        <a href="activity_03.html" class="site-nav__link">Activity 03</a>
      </nav>
      <div class="site-header__actions">
        <button
          type="button"
          class="btn btn--icon site-header__help"
          aria-label="How this works"
        >
          ?
        </button>
      </div>
    </header>

    <div class="toolbar">
      <button
        type="button"
        class="peek__trigger"
        data-peek="poet color"
        aria-haspopup="dialog"
      >
        Peek at the system prompts
      </button>
      <div class="toolbar__actions">
        <button type="button" class="btn toolbar__download">↓ Download image</button>
        <button type="button" class="btn btn--primary toolbar__send">
          Send to screen
        </button>
      </div>
    </div>

    <p class="notice" role="status" hidden></p>

    <main>
      <section class="activity-02">
        <div class="preview"></div>
        <div class="controls">
          <div class="word-palette">
            <h3>Word Palette + Editor</h3>
            <form id="form-keywords">
              <input
                type="text"
                name="keyword"
                id="input-keyword"
                maxlength="100"
                placeholder="Leave blank for filler"
              />
              <button type="submit">Generate Words</button>
            </form>
            <div class="words"></div>
          </div>
          <div class="editor">
            <form id="form-canvas-bg">
              <img src="images/icon_bg.svg" alt="" />
              <input
                type="text"
                name="canvas-bg"
                id="canvas-bg"
                maxlength="100"
                placeholder="Canvas background"
              />
              <button type="submit">Apply</button>
            </form>
            <form id="form-text-fg">
              <img src="images/icon_text.svg" alt="" />
              <input
                type="text"
                name="text-fg"
                id="text-fg"
                maxlength="100"
                placeholder="Text color"
              />
              <button type="submit">Apply</button>
            </form>
            <form id="form-text-bg">
              <img src="images/icon_tile.svg" alt="" />
              <input
                type="text"
                name="text-bg"
                id="text-bg"
                maxlength="100"
                placeholder="Tile background"
              />
              <button type="submit">Apply</button>
            </form>
            <div class="font-sizes">
              <div class="size">XS</div>
              <div class="size">S</div>
              <div class="size">M</div>
              <div class="size">L</div>
              <div class="size">XL</div>
            </div>
            <div class="font-toggle">Sans-serif</div>
          </div>
        </div>
      </section>
    </main>

    <script src="js/p5.min.js"></script>
    <script src="js/common.js"></script>
    <script src="js/instructions.js"></script>
    <script src="js/peek.js"></script>
    <script src="js/activity-02.js"></script>
    <script src="js/sketch.js"></script>
  </body>
</html>
