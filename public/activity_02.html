<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Machine Madlibs – field:work | Activity 02 – Visual Poetry</title>
    <link rel="stylesheet" href="css/normalize.css" />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/buttons.css" />
    <link rel="stylesheet" href="css/forms.css" />
    <link rel="stylesheet" href="css/dialogs.css" />
    <link rel="stylesheet" href="css/peek.css" />
    <link rel="stylesheet" href="css/activity-02.css" />
  </head>
  <body class="page--fit-wide">
    <header class="site-header">
      <h1>Machine Madlibs <span class="site-header__event">field:work</span></h1>
      <nav class="site-nav">
        <a href="activity_01.html" class="site-nav__link">Activity 01</a>
        <a href="activity_02.html" class="site-nav__link" aria-current="page"
          >Activity 02</a
        >
        <a href="activity_03.html" class="site-nav__link">Activity 03</a>
      </nav>
      <div class="site-header__actions">
        <button
          type="button"
          class="btn btn--icon site-header__help"
          aria-label="How this works"
        >
          ?
        </button>
      </div>
    </header>

    <div class="toolbar">
      <button
        type="button"
        class="peek__trigger"
        data-peek="poet color"
        aria-haspopup="dialog"
      >
        Peek at the system prompts
      </button>
      <div class="toolbar__actions">
        <button type="button" class="btn toolbar__download">↓ Download image</button>
        <button type="button" class="btn btn--primary toolbar__send">
          Send to screen
        </button>
      </div>
    </div>

    <main>
      <section class="activity-02">
        <div class="preview">
          <p class="preview__hint">Generate some words to begin.</p>
          <p class="notice notice--toast" role="status" hidden></p>
        </div>
        <div class="controls">
          <section class="controls__section controls__section--words">
            <h2 class="label">Words</h2>
            <form id="form-keywords" class="controls__row">
              <input
                type="text"
                name="keyword"
                id="input-keyword"
                class="input"
                maxlength="100"
                placeholder="A theme, or blank for filler"
                aria-label="Theme"
              />
              <button type="submit" class="btn btn--large">Generate</button>
            </form>
            <div class="words"></div>
          </section>

          <section class="controls__section">
            <h2 class="label">Canvas</h2>
            <form id="form-canvas-bg" class="controls__row controls__row--color">
              <img src="images/icon_bg.svg" alt="" class="controls__icon" />
              <div class="controls__field">
                <input
                  type="text"
                  name="canvas-bg"
                  id="canvas-bg"
                  class="input"
                  maxlength="100"
                  placeholder="Background color"
                  aria-label="Canvas background color"
                />
                <label class="controls__swatch">
                  <input
                    type="color"
                    class="controls__picker"
                    value="#e6e6e6"
                    aria-label="Pick the canvas background color"
                  />
                </label>
              </div>
              <button type="submit" class="btn btn--large">Apply</button>
            </form>
          </section>

          <section class="controls__section editor editor--idle">
            <div class="controls__heading">
              <h2 class="label">Selected word</h2>
              <button type="button" class="btn btn--small editor__remove">Remove</button>
            </div>
            <form id="form-text-fg" class="controls__row controls__row--color">
              <img src="images/icon_text.svg" alt="" class="controls__icon" />
              <div class="controls__field">
                <input
                  type="text"
                  name="text-fg"
                  id="text-fg"
                  class="input"
                  maxlength="100"
                  placeholder="Text color"
                  aria-label="Text color"
                />
                <label class="controls__swatch">
                  <input
                    type="color"
                    class="controls__picker"
                    value="#000000"
                    aria-label="Pick the text color"
                  />
                </label>
              </div>
              <button type="submit" class="btn btn--large">Apply</button>
            </form>
            <form id="form-text-bg" class="controls__row controls__row--color">
              <img src="images/icon_tile.svg" alt="" class="controls__icon" />
              <div class="controls__field">
                <input
                  type="text"
                  name="text-bg"
                  id="text-bg"
                  class="input"
                  maxlength="100"
                  placeholder="Tile color"
                  aria-label="Tile color"
                />
                <label class="controls__swatch">
                  <input
                    type="color"
                    class="controls__picker"
                    value="#000000"
                    aria-label="Pick the tile color"
                  />
                </label>
              </div>
              <button type="submit" class="btn btn--large">Apply</button>
            </form>
            <div
              class="segmented segmented--empty editor__sizes"
              role="group"
              aria-label="Size"
            >
              <button type="button" class="segmented__option" data-size="8">XS</button>
              <button type="button" class="segmented__option" data-size="12">S</button>
              <button type="button" class="segmented__option" data-size="16">M</button>
              <button type="button" class="segmented__option" data-size="20">L</button>
              <button type="button" class="segmented__option" data-size="24">XL</button>
              <button type="button" class="segmented__option" data-size="32">XXL</button>
            </div>
            <div
              class="segmented segmented--empty editor__fonts"
              role="group"
              aria-label="Font"
            >
              <button
                type="button"
                class="segmented__option segmented__option--sans"
                data-font="sans-serif"
              >
                Sans-serif
              </button>
              <button
                type="button"
                class="segmented__option segmented__option--serif"
                data-font="serif"
              >
                Serif
              </button>
            </div>
          </section>
        </div>
      </section>
    </main>

    <script src="js/p5.min.js"></script>
    <script src="js/common.js"></script>
    <script src="js/instructions.js"></script>
    <script src="js/peek.js"></script>
    <script src="js/activity-02.js"></script>
    <script src="js/sketch.js"></script>
  </body>
</html>
